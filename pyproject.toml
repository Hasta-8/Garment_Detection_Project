[project]
name = "garment-attributes"
version = "0.1.0"
description = "Zero-shot garment attribute extraction (Fashion-CLIP) behind a FastAPI service, CPU-only"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Same versions as the January 2026 build (requirements.txt), so that moving to uv and
# CPU-only torch is the only change (experiment G1 in the tracker).
dependencies = [
    "fastapi==0.116.1",
    "huggingface-hub==0.34.4",
    "numpy==2.2.6",
    "pillow==11.3.0",
    "pydantic-settings>=2.10",
    "python-multipart==0.0.20",
    "torch==2.8.0",
    "transformers==4.56.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=8", "ruff==0.17.6"]
eval = [
    "pyarrow>=21",
    "uvicorn>=0.35",
]

[tool.uv]
package = false

# CPU-only torch: the CUDA build pulls several GB of nvidia-* packages this target never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
